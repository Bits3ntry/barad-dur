# Reusable BARAD-DÛR security workflow (installable `barad` CLI).
#
# Two jobs, two trust boundaries:
#
#   scan     — credential-free. Installs the `barad` wheel and runs `barad scan`.
#              Pull requests, forks and internal branches all land here, so no
#              secret is reachable from code that could change the runner.
#   publish  — trusted default-branch and release refs only. `barad run` RESCANS
#              inside this job and then synchronizes the enabled integrations;
#              it does not resume the artifacts of the scan job. Credentials
#              exist only in that single publish step, and a failed publication
#              fails the job instead of being masked.
#
# Neither job uploads raw scanner output: `security.json` can embed secret
# matches and `sast.json` can embed source excerpts. Only the manifest, the
# sanitized Trivy report, the SBOM and the checksums are preserved, per job.
#
# Changes from the legacy runner workflow:
#   * `python -m barad_security run/sync`, `--pending` reuse and the
#     `requirements.txt` install are gone; the wheel is installed with
#     `pip install .` and exposes the `barad` entry point.
#   * the `trivy-runner` input is gone — the runner comes from
#     `scan.runner` in the configuration file.
#   * `BARAD_DUR_URL` / `BARAD_DUR_TOKEN` secrets are gone: the CLI has no Barad
#     API synchronizer, so declaring them promised publication that never ran.
#   * `config-file` now defaults to `config/ci.barad.yml`.
name: security

on:
  workflow_call:
    inputs:
      config-file:
        description: Path to the CLI configuration file, relative to the repository root.
        type: string
        required: false
        default: config/ci.barad.yml
      python-version:
        description: Python version used to install and run the CLI.
        type: string
        required: false
        default: "3.12"
    secrets:
      # Read by the publish step only; all are optional so a caller without
      # remote services still gets a credential-free scan.
      DTRACK_URL:
        required: false
      DTRACK_API_KEY:
        required: false
  pull_request:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    name: scan (no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out full history (the base reference needs PR commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.12' }}

      - name: Install the barad CLI
        run: python -m pip install --disable-pip-version-check --no-input .

      # No credential variable exists in this job's environment or in the
      # workflow configuration it reads. Exit code 1 (scan failed) keeps failing
      # the job; nothing about the scan is masked.
      - name: Run barad scan
        env:
          BARAD_CONFIG: ${{ inputs.config-file || 'config/ci.barad.yml' }}
        run: |
          set -uo pipefail
          barad scan . --config "$BARAD_CONFIG"

      - name: Preserve sanitized scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barad-scan-evidence-${{ github.run_id }}
          path: |
            .barad/reports/**/manifest.json
            .barad/reports/**/security.sanitized.json
            .barad/reports/**/sbom.cdx.json
            .barad/reports/**/checksums.sha256
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: publish (trusted refs only)
    needs: scan
    # Trusted contexts only. A pull request from a fork, an internal branch, or
    # `pull_request_target` never reaches this job; the only trusted surfaces are
    # a release event and the repository default branch.
    if: |
      always() && needs.scan.result == 'success' && (
        github.event_name == 'release' ||
        (
          github.event_name != 'pull_request' &&
          github.event_name != 'pull_request_target' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the trusted ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.12' }}

      - name: Install the barad CLI
        run: python -m pip install --disable-pip-version-check --no-input .

      # The only step that can see credentials. Missing credentials are reported
      # as a visible notice and skip publication; they never fake a success for a
      # publication that was attempted, and they never fail the scan-only path.
      - name: Publish (barad run, rescans with credentials)
        env:
          BARAD_CONFIG: ${{ inputs.config-file || 'config/ci.barad.yml' }}
          DTRACK_URL: ${{ secrets.DTRACK_URL }}
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
        run: |
          set -uo pipefail
          missing=""
          for name in DTRACK_URL DTRACK_API_KEY; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Publication skipped::Publish credentials are not configured:$missing"
            echo "No publication was attempted; the credential-free scan evidence is preserved."
            exit 0
          fi
          set +e
          barad run . --config "$BARAD_CONFIG" --json > publication.json
          status=$?
          set -e
          if [ -s publication.json ]; then
            cat publication.json
          fi
          exit "$status"

      - name: Preserve sanitized publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barad-publish-evidence-${{ github.run_id }}
          path: |
            .barad/reports/**/manifest.json
            .barad/reports/**/security.sanitized.json
            .barad/reports/**/sbom.cdx.json
            .barad/reports/**/checksums.sha256
            publication.json
          if-no-files-found: warn
          retention-days: 30
