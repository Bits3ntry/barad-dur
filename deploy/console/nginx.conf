# Barad console: static dist + API reverse proxy (same-origin, no CORS).
server {
    listen 80;
    server_name _;

    # Resolve the platform service at runtime via Docker's embedded DNS
    # (127.0.0.11) instead of caching its address at startup: containers get
    # a new IP when recreated, and a stale cache turns every proxied path
    # into a 502 until a console restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # The SBOM intake accepts CycloneDX documents up to 50 MB. nginx defaults
    # to 1 MB and otherwise rejects the request before the API can analyze it.
    client_max_body_size 50m;

    # Same-origin API path: nginx forwards to the platform service.
    # A variable in proxy_pass forces re-resolution with the resolver above.
    set $psa_upstream http://platform-api:8090;
    location /api/ {
        proxy_pass $psa_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # An AI turn is a chain of model calls, not a page fetch. The 60s default
        # killed every CVE question at the proxy *after* the run had already spent
        # the tokens — the operator saw a 504 over a completed answer, retried, and
        # paid twice. The ceiling here is a backstop for the client, not the run's
        # budget: that one is enforced in the API, per call.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API health checks through the same origin (console lance the same probe).
    location = /healthz {
        proxy_pass $psa_upstream;
    }

    # SPA fallback: unknown paths come back to the console shell.
    location / {
        try_files $uri /index.html;
    }
}
