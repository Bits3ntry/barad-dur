# Barad console: static dist + API reverse proxy (same-origin, no CORS).
server {
    listen 80;
    server_name _;

    # Resolve the platform service at runtime via Docker's embedded DNS
    # (127.0.0.11) instead of caching its address at startup: containers get
    # a new IP when recreated, and a stale cache turns every proxied path
    # into a 502 until a console restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API path: nginx forwards to the platform service.
    # A variable in proxy_pass forces re-resolution with the resolver above.
    set $psa_upstream http://platform-api:8090;
    location /api/ {
        proxy_pass $psa_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API health checks through the same origin (console lance the same probe).
    location = /healthz {
        proxy_pass $psa_upstream;
    }

    # SPA fallback: unknown paths come back to the console shell.
    location / {
        try_files $uri /index.html;
    }
}
