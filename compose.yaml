# BARAD-DÛR — one stack (evaluation only: loopback bindings, no TLS, no SSO).
#
#   docker compose up -d                    # postgres, API, console, worker, scaler
#   docker compose --profile ops up -d      # + the tick scheduler
#   docker compose ps                       # one project, every role in it
#
# Everything the platform needs to run a scan lives here: the API composes the
# plan, the worker executes it, the scaler keeps the pool at the size the queue
# asks for. There is no second project to remember and no service to start by
# hand.
#
# Secrets come from the gitignored .env (see README). Never put them in this file.
name: barad-dur

services:
  # ───────────── PostgreSQL: the only database this stack owns ─────────────
  # The volume is pinned to `barad-dur_postgres-db` because it already holds the
  # platform's data: renaming it would start against an empty cluster.
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: dtrack
      POSTGRES_USER: dtrack
      POSTGRES_PASSWORD: ${DT_DB_PASSWORD:-unused}
      # Read only by init-restore.sh when the volume is created for the first
      # time; kept optional so a fresh clone still comes up.
      DD_DB_PASSWORD: ${DD_DB_PASSWORD:-unused}
      BARAD_DB_PASSWORD: ${barad_db_password:?set barad_db_password in .env}
    volumes:
      - postgres-db:/var/lib/postgresql
      - migration-backup:/migration-backup:ro
      - ./docker/postgres/init-restore.sh:/docker-entrypoint-initdb.d/init-restore.sh:ro
    ports:
      # The API reaches Postgres inside this network; the port is published for
      # psql from the host and nothing else.
      - "127.0.0.1:${POSTGRES_PORT:-15443}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /var/lib/postgresql/.migration-restore-complete && pg_isready -h 127.0.0.1 -U dtrack -d dtrack
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30m
    # On the same network as the API, or `postgres` does not resolve and every
    # request fails with "name or service not known".
    networks: [edge]
    restart: unless-stopped

  # ──────────── Platform API: the plan, the grants, the evidence ────────────
  platform-api:
    build:
      context: backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PLATFORM_DATABASE_URL: postgresql+psycopg://barad:${barad_db_password:?set barad_db_password in .env}@postgres:5432/barad_platform
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_TOKEN: ${JIRA_TOKEN:-}
      JIRA_WEBHOOK_SECRET: ${JIRA_WEBHOOK_SECRET:-}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_API_URL: ${GITLAB_API_URL:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-}
      # Geolocation for the asset map. Opt-in and off by default: an empty value
      # keeps every address on this machine, and the page says "no geolocator
      # configured" instead of drawing a coordinate it does not have. Set it to a
      # URL template containing {address} to enable; answers are cached for 7 days.
      PLATFORM_GEOIP_URL: ${PLATFORM_GEOIP_URL:-http://ip-api.com/json/{address}?fields=status,country,countryCode,regionName,city,lat,lon,isp,org,as,timezone,query}
      ADVISORIES_AUTORUN: ${ADVISORIES_AUTORUN:-1}
      ADVISORIES_POLL_SECONDS: ${ADVISORIES_POLL_SECONDS:-300}
    ports:
      # 0.0.0.0 when a CI runner in another network must reach it; 127.0.0.1
      # (default) means host only.
      - "${PLATFORM_API_BIND:-127.0.0.1}:${PLATFORM_API_PORT:-8090}:8090"
    networks: [edge, runner]
    mem_limit: 512m
    restart: unless-stopped

  # ──────────── Console: static dist + same-origin API proxy ────────────
  console:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on:
      platform-api:
        condition: service_started
    volumes:
      - ./console_html:/usr/share/nginx/html:ro
      - ./deploy/console/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-8092}:80"
    networks: [edge]
    mem_limit: 128m
    restart: unless-stopped

  # ──────────── Worker: claims a run, executes the plan, reports back ────────────
  # The image carries the whole toolset (`SHAURON_TOOL_RUNTIME=local`), so this
  # container never needs the Docker socket: it runs the tools as child processes
  # and writes the same artifacts the container runtime writes.
  #
  # Replicas are not written here — the scaler sets them with
  # `docker compose up -d --scale shauron-worker=N` from Settings → Runtime.
  # `restart: unless-stopped` is what keeps the floor of one honest.
  shauron-worker:
    image: ${SHAURON_WORKER_IMAGE:-shauron-worker:recon}
    depends_on:
      platform-api:
        condition: service_started
    environment:
      SHAURON_PLATFORM: http://platform-api:8090
      SHAURON_BARAD_KEY: ${SHAURON_BARAD_KEY:?set SHAURON_BARAD_KEY to an API key}
      SHAURON_TOOL_RUNTIME: local
    command:
      - worker
      - --loops
      - "100000"
      - --interval
      - "5"
      - --out-dir
      - /var/tmp/runs
    networks: [runner]
    restart: unless-stopped

  # ──────────── Field runtime: ONE container, many sessions ────────────
  # Lanes are processes, not threads: each takes one task, with its own workspace
  # under /work/<mission> and its own HOME. A payload that kills a lane must not
  # touch another session, and no lane can reach the database: this container is on
  # `runner` (control) and `probe` (targets), never on `edge`.
  #
  # Deliberately NOT replicated: `docker compose up --scale field-runtime=N` would
  # multiply the ceiling and the blast radius at once. Capacity is FIELD_LANES.
  field-runtime:
    build:
      context: .
      dockerfile: docker/Dockerfile.field-runtime
    image: field-runtime:${FIELD_RUNTIME_TAG:-dev}
    depends_on:
      platform-api:
        condition: service_started
    environment:
      BARAD_PLATFORM: http://platform-api:8090
      BARAD_KEY: ${SHAURON_BARAD_KEY:?set SHAURON_BARAD_KEY to an API key}
      FIELD_LANES: ${FIELD_LANES:-4}
      FIELD_POLL_S: ${FIELD_POLL_S:-5}
      FIELD_WORK_ROOT: /work
      SHAURON_TOOL_RUNTIME: local
    volumes:
      - field-work:/work
    networks: [runner, probe]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 3g
    restart: unless-stopped

  # ──────────── Field agents: the lane a mission is dispatched to ────────────
  # One image, one loop: it reads the agent queue and runs each claimed task the
  # same way `shauron agent run <id>` does. Without this service a mission sits
  # `queued` until an operator pastes the id into a terminal, which is exactly the
  # "autonomous" step a person was still performing by hand.
  agent-worker:
    image: ${SHAURON_WORKER_IMAGE:-shauron-worker:recon}
    depends_on:
      platform-api:
        condition: service_started
    environment:
      SHAURON_PLATFORM: http://platform-api:8090
      SHAURON_BARAD_KEY: ${SHAURON_BARAD_KEY:?set SHAURON_BARAD_KEY to an API key}
      SHAURON_TOOL_RUNTIME: local
    command:
      - agent
      - worker
      - --loops
      - "100000"
      - --interval
      - "5"
      - --worker-name
      - agent-lane
      - --steps
      - "12"
    networks: [runner]
    mem_limit: 1g
    restart: unless-stopped

  # ──────────── Scaler: the only process that touches Docker ────────────
  # Reads the queue and the policy from the API and scales the worker service.
  # It is a service so it survives a closed terminal — which is the whole reason
  # the pool stopped draining in the first place.
  shauron-scaler:
    build:
      context: .
      dockerfile: docker/Dockerfile.scaler
    image: shauron-scaler:latest
    depends_on:
      platform-api:
        condition: service_started
    environment:
      SHAURON_PLATFORM: http://platform-api:8090
      SHAURON_BARAD_KEY: ${SHAURON_BARAD_KEY:?set SHAURON_BARAD_KEY to an API key}
      SHAURON_WORKER_SERVICE: shauron-worker
      SHAURON_COMPOSE_PROJECT: barad-dur
      SHAURON_COMPOSE_FILE: /Volumes/980PRO/Workspace/Councilbox/CYB/Barad-d-r/compose.yaml
      SHAURON_DRIVER: compose
    volumes:
      # One privileged mount in the whole deployment, owned by a small script
      # whose only job is `--scale`. The web app never gets this.
      - /var/run/docker.sock:/var/run/docker.sock
      # The stack definition, read-only, mounted at the *same absolute path* it
      # has on the host: Compose stamps the working directory into container
      # labels and recreates the network when it differs, which would disconnect
      # every other service mid-scale.
      - /Volumes/980PRO/Workspace/Councilbox/CYB/Barad-d-r:/Volumes/980PRO/Workspace/Councilbox/CYB/Barad-d-r:ro
    command: ["--apply", "--interval", "30"]
    networks: [edge]
    restart: unless-stopped

  # ──────────── Scheduler: the clock the API deliberately lacks ────────────
  # A tick endpoint advances due work and is idempotent, so a missed or doubled
  # tick costs nothing. Without BARAD_API_KEY the calls return 401 and the log
  # says so, instead of the stack pretending to be automatic.
  scheduler:
    image: curlimages/curl:8.10.1
    profiles: [ops]
    depends_on:
      platform-api:
        condition: service_started
    environment:
      BARAD_API_KEY: ${BARAD_API_KEY:-}
      TICK_INTERVAL: ${TICK_INTERVAL:-60}
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          for path in orchestration/schedules/tick notifications/tick projects/probes/tick advisories/tick; do
            curl -s -o /dev/null -w "$${path} %{http_code}\n" \
              -X POST "http://platform-api:8090/api/v1/$${path}" \
              -H "X-API-Key: $${BARAD_API_KEY}" \
              -H 'Content-Type: application/json' -d '{"actor":"scheduler"}'
          done
          sleep "$${TICK_INTERVAL}"
        done
    networks: [edge]
    mem_limit: 64m
    restart: unless-stopped

networks:
  # Published UIs and outbound egress (image pulls, advisory feeds, scanners).
  # Data plane: postgres, api, console. Nothing that runs untrusted input.
  edge: {}
  # Control plane: api, runtime, workers. No database reachable from here.
  runner: {}
  # Execution plane: the runtime's lanes and, later, the egress proxy.
  probe: {}

volumes:
  # Unified PostgreSQL data. Created and owned by this Compose project; the
  # pinned name is the guarantee that a rename never orphans it.
  postgres-db:
    name: barad-dur_postgres-db
  # Per-session workspaces for the field runtime. Kept so a killed lane can be
  # inspected; the daemon recreates a mission's directory on demand.
  field-work:
    name: barad-dur_field-work
  # Verified pg_dump archives taken before the cutover. External and read-only by
  # contract: `compose down -v` must never be able to remove the only copy.
  migration-backup:
    name: barad-dur_migration-backup
    external: true
