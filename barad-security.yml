# Configuration for scanning this repository itself (the runner's own code base).
# Trivy always runs through the pinned container, exactly as CI does.
version: 1

project:
  name: BARAD-DUR
  service: barad-dur-security-runner
  ecosystem: python
  path: .
  version:
    source: file
    path: VERSION

execution:
  local_enabled: true
  github_enabled: true
  fail_on_findings: false
  fail_on_scanner_error: true

trivy:
  enabled: true
  always_run: true
  runner: ${BARAD_TRIVY_RUNNER:-docker}
  image: aquasec/trivy:0.76.1
  cache_enabled: true
  cache_dir: .barad-dur/cache/trivy
  scan_type: fs
  scanners: [vuln, secret, misconfig]
  severity: [UNKNOWN, LOW, MEDIUM, HIGH, CRITICAL]
  # Tooling, generated evidence and vendored trees are not this project's inventory.
  exclude_paths:
    - .venv
    - artifacts
    - backups
    - node_modules
    - .codegraph
    - .git
    - .secrets

sbom:
  enabled: true
  generator: trivy
  format: cyclonedx
  generate_on:
    dependency_changes: true
    version_changes: true
    build_changes: true
    release: true

artifacts:
  directory: .barad-dur/security
  preserve_reports: true
  preserve_logs: true
  create_manifest: true
  checksums: sha256

integrations:
  barad_dur:
    enabled: false
    required: false
    endpoint_env: BARAD_DUR_URL
    token_env: BARAD_DUR_TOKEN
  dependency_track:
    enabled: false
    required: false
    endpoint_env: DTRACK_URL
    token_env: DTRACK_API_KEY
    publish_on_release: true
    update_development_project: false
    development_version: main
    auto_create: true
  defectdojo:
    enabled: false
    required: false
    endpoint_env: DOJO_URL
    token_env: DOJO_TOKEN
    publish_trivy_reports: false

notifications:
  direct_slack: false
